<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Midmar Mile Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one narrow column, today first, fixed bottom tab bar. The next swim and the guided workout sit on a deep "pool" ground with pace-clock numerals; everything else stays quiet on paper. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --ink: #0F211C;
  --muted: #566A63;
  --line: #D3DCD7;
  --water: #17594D;
  --water-soft: #DCEBE6;
  --buoy: #C2410C;
  --on-buoy: #FFFFFF;
  --pool: #0E3F37;
  --pool-ink: #F1F7F4;
  --pool-muted: #A9C7BD;
  --pool-line: #2A5C52;
  --pop: #FF8A55;
  --on-pop: #1B0B03;
  --t-tech: #17594D;
  --t-int: #6D38D4;
  --t-speed: #B5175B;
  --t-easy: #4A7410;
  --t-long: #1D4ED8;
  --t-tt: #8A5A06;
  --t-race: #C2410C;
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1512;
    --surface: #11221D;
    --ink: #E5EFEA;
    --muted: #8DA39A;
    --line: #223630;
    --water: #66C7AD;
    --water-soft: #17332C;
    --buoy: #FF8A55;
    --on-buoy: #1B0B03;
    --pool: #0F2C26;
    --pool-ink: #E5EFEA;
    --pool-muted: #8DB3A7;
    --pool-line: #24463D;
    --pop: #FF8A55;
    --on-pop: #1B0B03;
    --t-tech: #66C7AD;
    --t-int: #C4A7FF;
    --t-speed: #FF8FB8;
    --t-easy: #A8D568;
    --t-long: #8AB4FF;
    --t-tt: #F2C14E;
    --t-race: #FF8A55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1512;
  --surface: #11221D;
  --ink: #E5EFEA;
  --muted: #8DA39A;
  --line: #223630;
  --water: #66C7AD;
  --water-soft: #17332C;
  --buoy: #FF8A55;
  --on-buoy: #1B0B03;
  --pool: #0F2C26;
  --pool-ink: #E5EFEA;
  --pool-muted: #8DB3A7;
  --pool-line: #24463D;
  --pop: #FF8A55;
  --on-pop: #1B0B03;
  --t-tech: #66C7AD;
  --t-int: #C4A7FF;
  --t-speed: #FF8FB8;
  --t-easy: #A8D568;
  --t-long: #8AB4FF;
  --t-tt: #F2C14E;
  --t-race: #FF8A55;
  color-scheme: dark;
}
/* on the pool ground the workout colours always use their bright values */
.onpool {
  --t-tech: #66C7AD; --t-int: #C4A7FF; --t-speed: #FF8FB8; --t-easy: #A8D568; --t-long: #8AB4FF; --t-tt: #F2C14E; --t-race: #FF8A55;
}
.ty-tech { --t: var(--t-tech); } .ty-int { --t: var(--t-int); } .ty-speed { --t: var(--t-speed); } .ty-easy { --t: var(--t-easy); }
.ty-long { --t: var(--t-long); } .ty-tt { --t: var(--t-tt); } .ty-race { --t: var(--t-race); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--f-body);
  padding-inline: 16px;
  padding-block: 12px 108px;
  -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }
.wrap { max-width: 560px; margin-inline: auto; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--buoy); outline-offset: 2px; }
b { font-weight: 600; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 8px 14px; }
.eyebrow { font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.count { font: 700 60px/.9 var(--f-display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.count small { font: 600 22px var(--f-display); color: var(--muted); letter-spacing: .02em; margin-left: 8px; }
.topr { text-align: right; font: 600 14px var(--f-body); color: var(--muted); min-width: 0; }
.rope {
  height: 10px; margin-bottom: 18px;
  background:
    radial-gradient(circle at 5px 5px, var(--buoy) 3.5px, transparent 4px) 0 0 / 20px 10px repeat-x,
    radial-gradient(circle at 15px 5px, var(--water) 3.5px, transparent 4px) 0 0 / 20px 10px repeat-x,
    linear-gradient(var(--line), var(--line)) 0 50% / 100% 1px no-repeat;
}

/* shared pieces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card h3 { font: 700 22px/1.1 var(--f-display); margin-bottom: 10px; }
.card > p + p { margin-top: 8px; }
.sub { color: var(--muted); font-size: 15px; }
.btn { width: 100%; min-height: 50px; border-radius: 12px; border: 1.5px solid var(--buoy); background: var(--buoy); color: var(--on-buoy); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btnrow { display: grid; gap: 10px; margin-top: 14px; }
.lnk { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 44px; padding: 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 99px; font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--t, var(--water)); background: color-mix(in srgb, var(--t, var(--water)) 13%, transparent); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--water-soft); color: var(--water); font: 600 12px var(--f-body); letter-spacing: .04em; }
.legend { font-size: 13px; color: var(--muted); padding-inline: 4px; }
.err { color: var(--buoy); font-size: 14px; }
.pips { display: inline-flex; gap: 2px; margin-right: 7px; vertical-align: -1px; }
.pips i { width: 4px; height: 11px; border-radius: 1px; background: var(--pip, var(--line)); }
.pips.p1 i:nth-child(-n+1), .pips.p2 i:nth-child(-n+2), .pips.p3 i:nth-child(-n+3), .pips.p4 i { background: currentColor; }

/* nudge */
.nudge { border-color: var(--buoy); }
.nudge .btnrow { grid-template-columns: 1fr auto; align-items: center; }

/* next swim */
.hero { background: var(--pool); color: var(--pool-ink); border-radius: 18px; padding: 18px 18px 16px; margin-bottom: 20px; }
.hero .eyebrow { color: var(--pool-muted); }
.hero h1 { font: 700 46px/.95 var(--f-display); margin-top: 8px; text-wrap: balance; }
.hero .chip { background: rgba(255,255,255,.1); margin-top: 10px; }
.hero .meta { margin-top: 10px; color: var(--pool-muted); font-weight: 500; }
.mini { margin: 14px 0 16px; border-top: 1px solid var(--pool-line); }
.mini li { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--pool-line); }
.mini b { font: 700 26px/1 var(--f-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.mini span { color: var(--pool-muted); font-size: 14px; }
.hero .btn { background: var(--pop); border-color: var(--pop); color: var(--on-pop); }

/* week */
.wknav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.wkt { text-align: center; min-width: 0; }
.phase { font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--water); }
.wkt h2 { font: 700 34px/1 var(--f-display); margin-top: 2px; }
.wkt h2 span { font: 600 18px var(--f-display); color: var(--muted); }
.step { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.step:disabled { opacity: .35; cursor: default; }
.focus { margin: 10px auto 0; text-align: center; max-width: 36ch; text-wrap: balance; color: var(--muted); font-size: 15px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 14px; }
.dcell { display: grid; justify-items: center; gap: 2px; padding: 7px 0 8px; border-radius: 10px; border: 1px solid transparent; background: none; min-width: 0; }
.dcell .dn { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dcell .dd { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.dcell .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; border: 2px solid transparent; }
.dcell.has { background: var(--surface); border-color: var(--line); }
.dcell.has .dot { border-color: var(--t); }
.dcell.done .dot { background: var(--t); }
.dcell.today { border-color: var(--ink); }
.vol { margin: 14px 0 12px; }
.vol .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.vol .bar i { display: block; height: 100%; background: var(--water); border-radius: 3px; }
.vol p { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.srow { display: grid; grid-template-columns: 5px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 0; margin-bottom: 8px; min-height: 64px; overflow: hidden; }
.srow .stripe { align-self: stretch; margin-block: -12px; background: var(--t); }
.srow .st { min-width: 0; }
.srow .st b { display: block; font: 700 22px/1.1 var(--f-display); }
.srow .st span { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.srow .state { display: flex; align-items: center; gap: 4px; font: 600 12px var(--f-body); color: var(--muted); white-space: nowrap; }
.srow.done .state { color: var(--water); }
.srow .state.miss { color: var(--buoy); }
.srow.skip .st, .srow.skip .stripe { opacity: .5; }
.dcell.skip .dot { border-style: dotted; opacity: .6; }
.herolnk { color: var(--pool-muted); width: 100%; margin-top: 4px; }
.btnrow.two { grid-template-columns: 1fr 1fr; margin-top: 10px; }
.lnks { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; margin-top: 6px; }
.edsteps { margin: 12px 0 4px; }
.edsteps li { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.edrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.edrow.b { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.edrow .rm { min-height: 48px; }

/* workout detail */
.back { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; min-height: 44px; padding: 0 8px 0 0; color: var(--muted); font-weight: 600; margin-top: 4px; }
.detail h1 { font: 700 44px/.95 var(--f-display); margin-top: 10px; text-wrap: balance; }
.detail .when { color: var(--muted); margin-top: 6px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 16px 0; overflow: hidden; }
.facts > div { padding: 12px 10px; border-right: 1px solid var(--line); min-width: 0; }
.facts > div:last-child { border-right: 0; }
.facts b { display: block; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.why { color: var(--muted); max-width: 60ch; margin-bottom: 16px; }
.steps { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
.steps li { padding: 12px 14px 12px 16px; border-top: 1px solid var(--line); border-left: 5px solid transparent; }
.steps li:first-child { border-top: 0; }
.steps li.k-main, .steps li.k-race { border-left-color: var(--t); }
.tag { font: 600 11px var(--f-body); letter-spacing: .14em; color: var(--muted); }
.steps .q { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 2px; }
.steps .q b { font: 700 28px/1.05 var(--f-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.steps .k-wu .q b, .steps .k-cd .q b { font-size: 22px; }
.steps .lbl { color: var(--muted); font-size: 14px; }
.steps .zl { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 14px; }
.zone { font-weight: 600; white-space: nowrap; }
.tgt { color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); margin-bottom: 14px; padding-inline: 4px; }
.result { border-color: var(--water); }
.result .big { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.reps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.reps span { font: 600 13px var(--f-body); font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.move { margin-top: 6px; }
.move p { font: 600 13px var(--f-body); color: var(--muted); margin-bottom: 6px; }
.mvrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.mv { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 600 12px var(--f-body); padding: 0; }
.mv.cur { background: var(--water-soft); border-color: var(--water); color: var(--water); }
.mv:disabled { opacity: .35; cursor: default; }

/* forms */
form.stack, .setup { display: grid; gap: 14px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > label, .fld > .lab { font: 600 13px var(--f-body); color: var(--muted); }
.fld input[type=number], .fld input[type=date], .fld input[type=text], .fld select { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px; font: 500 18px var(--f-body); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.fld input, .fld select { min-width: 0; max-width: 100%; }
.fld input[type=date] { font-size: 16px; padding: 0 8px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.chk input { width: 22px; height: 22px; accent-color: var(--buoy); flex: none; }
.chk label { font-size: 15px; font-weight: 500; }
.opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.opt { position: relative; display: block; min-width: 0; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 600; font-size: 15px; padding: 0 2px; }
.days .opt span { min-height: 44px; font-size: 13px; }
.feel .opt span { font-size: 12px; line-height: 1.15; }
.opt input:checked + span { background: var(--water-soft); border-color: var(--water); color: var(--water); }
.opt input:focus-visible + span { outline: 3px solid var(--buoy); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); }
.sum b { color: var(--ink); }

/* plan */
.phasehead { margin: 8px 0 4px; }
.phasehead h2 { font: 700 26px/1.1 var(--f-display); }
.phasehead p { font-size: 14px; color: var(--muted); }
.list { margin-bottom: 22px; border-top: 1px solid var(--line); }
.weekrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; min-height: 60px; }
.weekrow .n { font: 700 32px/1 var(--f-display); color: var(--water); text-align: center; }
.weekrow .t { min-width: 0; }
.weekrow .t b { display: block; font-size: 15px; }
.weekrow .t span { display: block; font-size: 13px; color: var(--muted); }
.weekrow .r { text-align: right; font: 600 13px var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.weekrow .r em { font-style: normal; display: block; color: var(--ink); font-size: 15px; }
.weekrow.now .n::after { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--buoy); margin: 4px auto 0; }

/* charts */
svg.chart { width: 100%; height: auto; display: block; }
.grid { stroke: var(--line); stroke-width: 1; fill: none; }
.ax { fill: var(--muted); font: 500 10.5px var(--f-body); }
.ax.cur { fill: var(--buoy); font-weight: 600; }
.goal { stroke: var(--buoy); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.goalt { fill: var(--buoy); font: 600 10.5px var(--f-body); }
.ln { fill: none; stroke: var(--water); stroke-width: 2; }
.pt { fill: var(--water); stroke: var(--surface); stroke-width: 2; }
.pt.ow { fill: var(--buoy); }
.bp { fill: var(--line); }
.bd { fill: var(--water); }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--water); margin-right: 6px; }
.key span.o::before { background: var(--buoy); }
.key span.sq::before { border-radius: 2px; }
.key span.pl::before { background: var(--line); border-radius: 2px; }
.empty { font-size: 14px; color: var(--muted); margin-top: 8px; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0; overflow: hidden; }
.stats > div { padding: 14px 12px; border-right: 1px solid var(--line); min-width: 0; }
.stats > div:last-child { border-right: 0; }
.stats .v { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats .v small { font: 600 16px var(--f-display); color: var(--muted); }
.stats .l { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
.bigline { font: 700 44px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.bigline small { font: 600 20px var(--f-display); color: var(--muted); margin-left: 6px; }
.zt { margin: 12px 0 4px; border-top: 1px solid var(--line); }
.zt li { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.zt .zp { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.zt .zc { font-size: 13px; color: var(--muted); min-width: 0; }
.miles li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.miles li:first-child { border-top: 0; }
.dot2 { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.dot2 .ic { width: 14px; height: 14px; stroke-width: 3; }
.miles li.ok .dot2 { background: var(--water); border-color: var(--water); color: var(--surface); }
.miles .w { font: 500 13px var(--f-body); color: var(--muted); text-align: right; }
.entries li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.entries li:first-child { border-top: 0; }
.entries .md { font: 700 22px var(--f-display); font-variant-numeric: tabular-nums; }
.entries .dd { font-size: 13px; color: var(--muted); }
.entries .tg { font: 600 12px var(--f-body); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.entries .tg.o { color: var(--buoy); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.rm { min-height: 40px; min-width: 40px; border: 0; background: none; color: var(--muted); border-radius: 8px; font-size: 13px; text-decoration: underline; }

/* race */
.tips li { padding: 12px 0; border-top: 1px solid var(--line); }
.tips li:first-child { border-top: 0; }
.tips b { display: block; font: 700 20px/1.1 var(--f-display); margin-bottom: 2px; }
.tips span { color: var(--muted); font-size: 15px; }
.cardp a { color: var(--water); }

<script>
(() => {
  'use strict';
  const DAY = 864e5, OW_GOAL = 4;
  const KEY = 'midmar-trainer-v2', OLD_KEY = 'midmar-trainer-v1', SND_KEY = 'midmar-trainer-sound';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const DEF = { start: '2026-10-05', race: '2027-02-13', level: 200, perWeek: 3, days: [1, 3, 6], pool: 25, peak: 2000, setup: false };
  const PRESETS = { 2: [3, 6], 3: [1, 3, 6], 4: [1, 2, 4, 6] };
  const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
  const TABS = ['today', 'plan', 'progress', 'race', 'setup'];

  const TYPES = {
    tech: { name: 'Technique', c: 'tech', why: 'Smooth technique makes every metre cheaper. Swim these slowly and think about one thing at a time.' },
    build: { name: 'Intervals', c: 'int', why: 'Short repeats with rest let you cover more distance than you could non-stop. That builds your base.' },
    thr: { name: 'Threshold', c: 'int', why: 'Threshold reps teach you to hold a strong pace without fading. Swim every rep at the same speed.' },
    pyr: { name: 'Pyramid', c: 'int', why: 'A pyramid mixes distances so you practise pacing. Start controlled and keep the long middle swim steady.' },
    speed: { name: 'Speed', c: 'speed', why: 'Short, fast reps sharpen your feel for the water and make your steady pace feel easier.' },
    easy: { name: 'Easy', c: 'easy', why: 'Easy metres build endurance without tiring you out for the long swim.' },
    long: { name: 'Long swim', c: 'long', why: 'The long swim is the heart of the plan. It builds the endurance and the confidence to cover 1.6 km.' },
    tt: { name: 'Time trial', c: 'tt', why: 'A timed swim shows where your fitness is and sets your target paces for the next block.' },
    race: { name: 'Race', c: 'race', why: 'This is what the plan was for. Start steady, find clear water, and build through the second half.' }
  };
  const ZONES = {
    easy: { name: 'Easy', f: 1.10, lvl: 1, cue: 'Relaxed. You could chat at the wall.' },
    steady: { name: 'Steady', f: 1.04, lvl: 2, cue: 'Controlled, with rhythmic breathing.' },
    thr: { name: 'Threshold', f: 1.00, lvl: 3, cue: 'Hard but repeatable.' },
    fast: { name: 'Fast', f: 0.94, lvl: 4, cue: 'Strong, just short of a sprint.' },

  const FEEL = ['Easy', 'Comfy', 'Solid', 'Hard', 'All out'];
  const DRILLS = [
    ['Side-kick drill', 'Kick on your side with the lower arm out front and your face down. Roll to breathe.'],
    ['Catch-up drill', 'One arm waits out front until the other hand touches it.'],
    ['Fingertip drag', 'Drag your fingertips along the surface on each recovery to keep your elbows high.'],
    ['6-kick switch', 'Six kicks on one side, one stroke, then six kicks on the other side.'],
    ['Breathe every 3', 'Breathe on every third stroke so you use both sides.'],
    ['Sighting practice', 'Lift your eyes forward every sixth stroke, then roll to breathe.']
  ];
  const KIND = { wu: 'Warm up', drill: 'Drill', main: 'Main set', cd: 'Cool down', race: 'Race' };

  const $ = id => document.getElementById(id);
  const num = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };

  const fmtS = d => d.getDate() + ' ' + MON[d.getMonth()];
  const fmtD = d => DOW[d.getDay()] + ' ' + fmtS(d);
  const fmtY = d => fmtS(d) + ' ' + d.getFullYear();
  const fmtDist = a => a >= 1000 ? (Math.round(a / 10) / 100) + ' km' : num(a) + ' m';
  const weeksBetween = (start, race) => Math.floor(Math.round((race - start) / DAY) / 7);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const byDate = (x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0;
  function fmtT(s) {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function fmtMin(s) { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); }
  function parseT(str) {
    const m = /^\s*(?:(\d{1,2}):)?(\d{1,3}):([0-5]\d)\s*$/.exec(str || '');
    return m ? (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) : NaN;
  }
  const pips = n => `<span class="pips p${n}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;

  /* ---------- config ---------- */
  function validRace(cfg) {
    const rw = weeksBetween(mondayOf(parseISO(cfg.start)), parseISO(cfg.race));
    return rw >= 5 && rw <= 39;
  }
  function normCfg(c) {
    c = c && typeof c === 'object' ? c : {};
    const o = {};
    o.start = ISO_RE.test(c.start) ? c.start : DEF.start;
    o.race = ISO_RE.test(c.race) ? c.race : DEF.race;
    o.level = isFinite(c.level) ? Math.min(2400, Math.max(0, Math.round(c.level))) : DEF.level;
    o.perWeek = [2, 3, 4].includes(c.perWeek) ? c.perWeek : DEF.perWeek;
    const dd = Array.isArray(c.days) ? c.days.filter((x, i, a) => x >= 0 && x <= 6 && x % 1 === 0 && a.indexOf(x) === i) : [];
    o.days = dd.length === o.perWeek ? dd.slice().sort((a, b) => a - b) : PRESETS[o.perWeek].slice();
    o.pool = c.pool === 50 ? 50 : 25;
    o.peak = [1600, 2000, 2400].includes(c.peak) ? c.peak : DEF.peak;
    o.setup = !!c.setup;
    if (!validRace(o)) { o.start = DEF.start; o.race = DEF.race; }
    return o;
  }
  const startLong = cfg => Math.min(cfg.peak, Math.max(100, cfg.level >= 400 ? cfg.level * 0.8 : cfg.level));

  /* ---------- plan generator ---------- */
  function buildPlan(cfg) {
    const pool = cfg.pool, PEAK = cfg.peak;
    const start = mondayOf(parseISO(cfg.start)), race = parseISO(cfg.race);
    const raceWeek = weeksBetween(start, race), W = raceWeek + 1, Tn = W - 2;
    const raceOff = Math.round((race - addDays(start, raceWeek * 7)) / DAY);
    const offs = cfg.days.map(d => (d + 6) % 7).sort((a, b) => a - b);

    const stp = v => pool === 50 ? 50 : (v < 500 ? 25 : 50);
    const rnd = (x, s) => Math.max(s, Math.round(x / s) * s);
    const restFor = p => Math.max(15, Math.round((40 - 20 * p) / 5) * 5);
    const repDist = x => { const d = x < 150 ? 50 : x < 300 ? 75 : x < 500 ? 100 : x < 1400 ? 200 : x < 1800 ? 300 : 400; return Math.max(pool, Math.ceil(d / pool) * pool); };
    const wc = a => a < 1000 ? [100, 50] : [200, 100];
    const S = (kind, reps, dist, zone, rest, label) => ({ kind, reps, dist, zone, rest: rest || 0, label: label || '' });
    const mk = (type, title, steps, extra) => Object.assign({ type, title, steps, note: '' }, extra || {});
    const drillOf = t => DRILLS[t % DRILLS.length];

    function tech(t, a, p) {
      const [w, c] = wc(a), total = Math.min(800, 0.5 * a + 250), d = repDist(a * 0.5), dr = drillOf(t);
      return mk('tech', 'Technique', [S('wu', 1, w, 'easy'), S('drill', 4, pool, 'easy', 15, dr[0]),
        S('main', Math.max(2, Math.round(total / d)), d, 'easy', Math.max(15, restFor(p) - 5), 'long, smooth strokes'), S('cd', 1, c, 'easy')], { note: dr[0] + ': ' + dr[1] });
    }
    function build(a, p) {
      const [w, c] = wc(a), total = Math.min(1600, 1.2 * a + 300), d = repDist(a);
      return mk('build', 'Build intervals', [S('wu', 1, w, 'easy'), S('main', Math.max(2, Math.round(total / d)), d, 'steady', restFor(p)), S('cd', 1, c, 'easy')]);
    }
    function thr(a, p) {
      const [w, c] = wc(a), total = Math.min(1600, 1.2 * a + 300), d = repDist(a);
      return mk('thr', 'Threshold reps', [S('wu', 1, w, 'easy'), S('main', Math.max(2, Math.round(total / d)), d, 'thr', Math.max(20, restFor(p))), S('cd', 1, c, 'easy')]);
    }
    function speed(a) {
      const [w, c] = wc(a), n = Math.min(16, Math.max(8, Math.round((0.5 * a + 200) / 50)));
      return mk('speed', 'Speed set', [S('wu', 1, w, 'easy'), S('drill', 4, pool, 'steady', 15, 'build each length'),
        S('main', n, 50, 'fast', 30), S('main', 1, 200, 'easy', 0, 'loosen off'), S('cd', 1, c, 'easy')]);
    }
    function pyr(a) {
      const [w, c] = wc(a), ds = a >= 1400 ? [100, 200, 300, 400, 300, 200, 100] : [100, 200, 300, 200, 100];
      return mk('pyr', 'Pyramid', [S('wu', 1, w, 'easy')].concat(ds.map(d => S('main', 1, d, 'steady', 20)), [S('cd', 1, c, 'easy')]), { ladder: ds });
    }
    function trial(a) {
      const [w] = wc(a), d = a >= 400 ? 400 : a >= 200 ? 200 : 100, dd = repDist(a * 0.5);
      return mk('tt', 'Time trial', [S('wu', 1, w, 'easy'), S('drill', 4, pool, 'steady', 20, 'build each length'), S('main', 1, d, 'max', 0, 'timed'),
        S('main', Math.max(2, Math.round(0.6 * a / dd)), dd, 'easy', 20, 'aerobic'), S('cd', 1, 100, 'easy')],
        { tt: d, note: 'Push off from the wall, no dive. Swim the ' + d + ' m evenly and check your time as you touch.' });
    }
    function longS(a, p, title, note, ow) {
      const [w, c] = wc(a);
      if (a >= 400) return mk('long', title || 'Long swim', [S('wu', 1, w, 'easy'), S('main', 1, a, 'easy', 0, 'non-stop'), S('cd', 1, c, 'easy')], { cont: a, note: note || '', ow: !!ow });
      const d = Math.max(pool, rnd(a * 0.5, pool)), n = Math.max(3, Math.ceil(a * 2.5 / d));
      return mk('long', title || 'Endurance set', [S('wu', 1, w, 'easy'), S('main', n, d, 'easy', restFor(p)), S('cd', 1, c, 'easy')], { note: note || '' });
    }

      const ev = rnd(a * 0.6, stp(a * 0.6)), [w, c] = wc(ev);
      if (ev >= 400) return mk('easy', 'Easy swim', [S('wu', 1, w, 'easy'), S('main', 1, ev, 'easy', 0, 'non-stop'), S('cd', 1, c, 'easy')]);
      const d = Math.max(pool, rnd(ev * 0.5, pool)), n = Math.max(3, Math.ceil(ev * 2.5 / d));
      return mk('easy', 'Easy swim', [S('wu', 1, w, 'easy'), S('main', n, d, 'easy', restFor(p)), S('cd', 1, c, 'easy')]);
    }
    function lineup(t, a, p, o) {
      const L = longS(a, p, o.title, o.note, o.ow);
      const Q = o.q === 'tt' ? trial(a) : o.q === 'thr' ? thr(a, p) : o.q === 'speed' ? speed(a) : o.q === 'pyr' ? pyr(a) : o.q === 'rp'
        ? mk('thr', 'Race-pace reps', [S('wu', 1, 200, 'easy'), S('main', 4, 200, 'thr', 30), S('cd', 1, 100, 'easy')]) : build(a, p);
      if (cfg.perWeek === 2) {
        if (!Q.steps.some(s => s.kind === 'drill')) { const dr = drillOf(t); Q.steps.splice(1, 0, S('drill', 4, pool, 'easy', 15, dr[0])); Q.note = dr[0] + ': ' + dr[1]; }
        return [Q, L];
      }

    }

    /* long-swim ladder: geometric growth, a lighter week every 4th week */
    const a0 = startLong(cfg);
    const a = [], rec = [], bv = [];
    for (let t = 0; t < Tn; t++) {
      const prog = Tn > 1 ? t / (Tn - 1) : 1;
      bv[t] = a0 * Math.pow(PEAK / a0, prog);
      rec[t] = (t % 4 === 3 && t < Tn - 1);
      const v = rec[t] ? bv[t] * 0.75 : bv[t];
      a[t] = rnd(v, stp(v));
    }
    let m4 = -1;
    if (cfg.level < 400) for (let t = 0; t < Tn; t++) { if (!rec[t] && a[t] >= 400) { m4 = t; break; } }

    const cand = [], owAt = {};
    for (let t = 0; t < Tn; t++) if (!rec[t] && a[t] >= 800) cand.push(t);
    const picks = cand.length <= OW_GOAL ? cand.map((_, i) => i) : [0, 1, 2, 3].map(i => Math.round(i * (cand.length - 1) / 3));
    picks.forEach((ci, i) => { owAt[cand[ci]] = i; });
    const OW1 = 'First open-water swim. Swim 10 to 15 minutes easy with a buddy, close to the shore, then finish the distance in the pool.';
    const OW = 'Do this one in open water, in a dam or the sea, with a buddy and close to the shore. Never swim alone. Use the pool if conditions are unsafe.';
    const SIGHT = ' Practise sighting: lift your eyes, find a landmark, then breathe.';

    const codes = [], weeks = [];
    const phaseIdx = code => { let i = codes.indexOf(code); if (i < 0) { codes.push(code); i = codes.length - 1; } return i; };
    let qi = 0;
    for (let t = 0; t < Tn; t++) {
      const prog = Tn > 1 ? t / (Tn - 1) : 1;

      const code = bv[t] < 400 ? 'base' : 'end';
      if (t === Tn - 1) { title = 'Milestone swim'; note = PEAK > 1600 ? fmtDist(PEAK) + ' is ' + (PEAK - 1600) + ' m more than the race.' : 'This is the full race distance.'; f = 'Milestone week: ' + fmtDist(PEAK) + ' non-stop.'; }
      else if (t === m4) { title = 'Milestone swim'; note = 'Your first ' + num(a[t]) + ' m without stopping. If you feel good at the end, keep going a little further.'; f = 'Milestone week: ' + num(a[t]) + ' m non-stop.'; }
      else if (rec[t]) f = 'Recovery week. Lower volume, and a time trial to reset your paces.';
      else if (a[t] < 400) f = 'Build with short reps. Focus on relaxed breathing.';
      else f = fmtDist(a[t]) + ' non-stop.';
      let ow = false;
      if (owAt[t] !== undefined) {
        const on = owAt[t] === 0 ? OW1 : OW + (owAt[t] === 2 ? SIGHT : '');

        f += ' Open-water swim this week.';
      }
      let q;
      if (rec[t] || (t === 0 && cfg.level >= 100)) q = 'tt';
      else if (bv[t] < 400) q = 'build';
      else { q = ['thr', 'speed', 'pyr'][qi % 3]; if (q === 'pyr' && a[t] < 600) q = 'thr'; qi++; }
      if (t === 0 && q === 'tt') f = 'Start with a time trial to set your paces.';

  function viewHeader() {

      ${rs ? `<p class="sub">Main set average ${fmtT(rs.avg)} per 100 m</p><div class="reps">${rs.chips}</div>` : ''}
      <div class="lnks"><button class="lnk" data-act="editres">Edit result</button><button class="lnk" data-act="undo" data-key="${s.key}">Mark as not done</button></div></section>`;
  }
  function moveRow(s) {
    const W = PL.weeks[s.w], ws = wsOf(s.w);
    let h = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), cur = +s.at === +d, off = !cur && (d >= PL.race || W.s.some(o => o !== s && +o.at === +d));
      h += `<button class="mv${cur ? ' cur' : ''}" data-act="move" data-key="${s.key}" data-to="${iso(d)}"${off ? ' disabled' : ''}${cur ? ' aria-pressed="true"' : ''} aria-label="${cur ? 'Planned for' : 'Move to'} ${fmtD(d)}">${DOW[d.getDay()]}</button>`;
    }

  }
  function editForm(s) {
    const rows = edDraft.map((st, i) => `<li><p class="tag">${KIND[st.kind].toUpperCase()}${st.label ? ' · ' + esc(st.label.toUpperCase()) : ''}</p>
      <div class="edrow"><div class="fld"><label for="ed${i}r">Reps</label><input id="ed${i}r" type="number" inputmode="numeric" min="1" max="60" value="${st.reps}"></div>
        <div class="fld"><label for="ed${i}d">Metres</label><input id="ed${i}d" type="number" inputmode="numeric" min="${PL.pool}" max="10000" step="${PL.pool}" value="${st.dist}"></div>
        <div class="fld"><label for="ed${i}s">Rest (s)</label><input id="ed${i}s" type="number" inputmode="numeric" min="0" max="600" step="5" value="${st.rest}"></div></div>
      <div class="edrow b"><div class="fld"><label for="ed${i}z">Effort</label><select id="ed${i}z">${['easy', 'steady', 'thr', 'fast'].concat(st.zone === 'max' ? ['max'] : []).map(z => `<option value="${z}"${z === st.zone ? ' selected' : ''}>${ZONES[z].name}</option>`).join('')}</select></div>

  function syncEd() {

    });
  }
  function saveEd() {
    syncEd();

    for (const st of edDraft) {

      if (!(st.rest >= 0 && st.rest <= 600)) return fail('Rest must be between 0 and 600 seconds.');

    if (!edDraft.some(st => st.kind === 'main')) return fail('Keep at least one main set.');
    state.edits[s.key] = { steps: edDraft.map(st => ({ kind: st.kind, reps: st.reps, dist: st.dist, zone: st.zone, rest: st.rest, label: st.label === 'non-stop' && st.reps > 1 ? '' : st.label })) };
    editing = false; applyMoves(); save(); render(); top();
  }
  function viewDetail(s) {
    const dn = state.done[s.key], ms = mainStep(s), z = ZONES[ms.zone], p = ms.zone !== 'max' && pace(ms.zone);
    const third = p ? `<b>${fmtT(p)}</b><span>${z.name.toLowerCase()} pace per 100 m</span>` : `<b>${z.name}</b><span>main effort</span>`;
    let h = `<section class="detail ${tyc(s)}"><button class="back" data-act="back">${ICON_L}Week ${s.w + 1}</button><div><p class="chip">${TYPES[s.type].name}</p></div>
      <h1>${esc(s.title)}</h1><p class="when">${fmtD(s.at)} · week ${s.w + 1} of ${PL.N}</p>
      <div class="facts"><div><b>${num(s.metres)} m</b><span>${s.race ? 'open water' : (s.metres / PL.pool) + ' lengths'}</span></div><div><b>${fmtMin(est(s))}</b><span>estimated</span></div><div>${third}</div></div>

  function weekBars() {
    const W = 360, H = 170, Lm = 42, Rm = 8, Tm = 12, Bm = 26, pw = W - Lm - Rm, ph = H - Tm - Bm, n = PL.N, cw = curWeek(), started = today() >= PL.begin;
    const top = Math.max(1000, Math.ceil(PL.maxWeek / 1000) * 1000), slot = pw / n, bw = Math.max(3, Math.min(22, slot - 3));
    const Y = m => Tm + ph * (1 - m / top);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned and swum distance for each week of the plan">`;
    [0, top / 2, top].forEach(v => { s += `<line class="grid" x1="${Lm}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${Lm - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v === 0 ? '0' : (v / 1000) + ' km'}</text>`; });
    const every = Math.ceil(n / 7);
    PL.weeks.forEach((wkk, i) => {
      const x = Lm + slot * i + (slot - bw) / 2, dm = wkk.s.reduce((a, o) => a + (state.done[o.key] ? o.metres : 0), 0);
      s += `<rect class="bp" x="${x.toFixed(1)}" y="${Y(wkk.metres).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(0) - Y(wkk.metres)).toFixed(1)}" rx="2"/>`;
      if (dm) s += `<rect class="bd" x="${x.toFixed(1)}" y="${Y(dm).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(0) - Y(dm)).toFixed(1)}" rx="2"/>`;
      const isCur = started && i === cw;
      if (isCur || (i % every === 0 && Math.abs(i - cw) >= every / 2) || (!started && i % every === 0)) s += `<text class="ax${isCur ? ' cur' : ''}" x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${isCur ? 'Wk ' : ''}${i + 1}</text>`;
    });
    return s + '</svg><div class="key"><span class="sq pl">Planned</span><span class="sq">Swum</span></div>';
  }
  function viewPlan() {
    const cw = curWeek(), t = today(), km = PL.weeks.reduce((x, w) => x + w.metres, 0) / 1000;
    let h = `<section class="card"><h3>Your plan</h3><p class="sub"><b class="sum">${PL.N} weeks, ${PL.total} swims, ${Math.round(km)} km.</b> The long swim builds from ${fmtDist(PL.weeks[0].long)} to ${fmtDist(PL.peak)}, with a lighter week and a time trial every fourth week.</p>
      <div style="margin-top:12px">${weekBars()}</div></section>`;

          <span class="t"><b>${fmtS(ws)} to ${fmtS(addDays(ws, 6))}</b><span>${esc(W.f)}</span></span><span class="r"><em>${dn}/${W.s.length}</em>${num(W.metres)} m</span></button>`;
      });
      h += '</div></section>';

    return h;
  }

  function nonstopChart() {
    const W = 360, H = 220, Lm = 42, Rm = 14, Tm = 14, Bm = 28, pw = W - Lm - Rm, ph = H - Tm - Bm;
    const t0 = PL.start.getTime(), t1 = PL.race.getTime(), top = Math.max(2000, PL.peak);
    const X = t => Lm + pw * Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
    const Y = m => Tm + ph * (1 - Math.min(m, top) / top);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Longest non-stop swims over time, with the 1.6 km race distance marked">`;
    for (let v = 0; v <= top; v += top > 2000 ? 600 : 500) s += `<line class="grid" x1="${Lm}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${Lm - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v === 0 ? '0' : (v / 1000) + ' km'}</text>`;
    s += `<text class="ax" x="${Lm}" y="${H - 8}" text-anchor="start">${MON[PL.start.getMonth()]}</text>`;
    let lastX = Lm + 14, mt = new Date(PL.start.getFullYear(), PL.start.getMonth() + 1, 1);
    while (mt < PL.race) {
      const mx = X(mt.getTime());
      if (mx - lastX >= 26 && W - Rm - mx >= 12) { s += `<text class="ax" x="${mx}" y="${H - 8}" text-anchor="middle">${MON[mt.getMonth()]}</text>`; lastX = mx; }
      mt = new Date(mt.getFullYear(), mt.getMonth() + 1, 1);
    }
    s += `<line class="goal" x1="${Lm}" x2="${W - Rm}" y1="${Y(1600)}" y2="${Y(1600)}"/><text class="goalt" x="${W - Rm}" y="${Y(1600) - 5}" text-anchor="end">Race 1.6 km</text>`;

    if (pts.length > 1) s += `<polyline class="ln" points="${pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}"/>`;
    pts.forEach(p => { s += `<circle class="pt${p.ow ? ' ow' : ''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5"/>`; });
    return s + '</svg>';
  }

  function viewProgress() {

      });

  function viewRace() {

  function draftPreview(d) {
    if (!ISO_RE.test(d.start) || !ISO_RE.test(d.race) || !validRace(d) || !(d.level >= 0)) return '';
    const n = weeksBetween(mondayOf(parseISO(d.start)), parseISO(d.race)) + 1, tn = n - 2, a0 = startLong(d);

      <section class="card setup"><h3 style="margin:0">Build your plan</h3>
      <div class="fld"><label for="cfgLevel">Longest swim you can do now without stopping (metres)</label><input id="cfgLevel" type="number" inputmode="numeric" min="0" max="2400" step="25" value="${isNaN(d.level) ? '' : d.level}"><p class="hint">Enter 0 if you cannot swim a full length yet. Your first long swim is set from this.</p></div>

        <select id="cfgTTDist" aria-label="Timed swim distance">${[100, 200, 400, 800, 1500].map(x => `<option value="${x}"${x === d.ttDist ? ' selected' : ''}>${num(x)} m</option>`).join('')}</select>
        <input id="cfgTTTime" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 2:10" aria-label="Timed swim time" value="${esc(d.ttTime)}"></div>
        <p class="hint">${lt ? `Your paces now come from ${lt.dist} m in ${fmtT(lt.secs)}. Enter a newer time to update them.` : 'This sets a target time for every set. You can skip it and do the time trial in week 1.'}</p></div>
      <div class="row2"><div class="fld"><label for="cfgStart">Plan starts</label><input id="cfgStart" type="date" value="${esc(d.start)}"></div>
        <div class="fld"><label for="cfgRace">Race day</label><input id="cfgRace" type="date" value="${esc(d.race)}"></div></div>
      <button class="btn ghost" type="button" data-act="startnow">Start the plan today</button>
      <div class="fld"><span class="lab">Swims per week</span><div class="opts" role="radiogroup" aria-label="Swims per week">${[2, 3, 4].map(n => opt('radio', 'perWeek', n, n, d.perWeek === n, 'cfgPer' + n)).join('')}</div></div>
      <div class="fld"><span class="lab">Swim days (pick ${d.perWeek})</span><div class="days">${order.map(n => opt('checkbox', 'day', n, DOW[n], d.days.includes(n), 'cfgDay' + n)).join('')}</div>
        <p class="hint">The long swim goes on your last swim day of the week. A weekend day suits it.</p></div>
      <div class="fld"><span class="lab">Pool length</span><div class="opts" role="radiogroup" aria-label="Pool length">${opt('radio', 'pool', 25, '25 m', d.pool === 25, 'cfgPool25')}${opt('radio', 'pool', 50, '50 m', d.pool === 50, 'cfgPool50')}</div></div>
      <div class="fld"><span class="lab">Longest swim before the race</span><div class="opts" role="radiogroup" aria-label="Longest swim before the race">${[1600, 2000, 2400].map(n => opt('radio', 'peak', n, fmtDist(n), d.peak === n, 'cfgPeak' + n)).join('')}</div>
        <p class="hint">The race is 1.6 km. Going past it in training gives you a margin on the day.</p></div>
      <p class="hint" id="cfgPrev">${draftPreview(d)}</p><p class="err" id="cfgErr" role="alert"></p>
      <button class="btn" data-act="apply">${state.cfg.setup ? 'Update plan' : 'Build my plan'}</button></section>
      <p class="legend">Swims you have ticked stay ticked by date when the plan changes. Your logged swims and times are kept.</p>`;
  }

  const VIEWS = { today: viewToday, plan: viewPlan, progress: viewProgress, race: viewRace, setup: viewSetup };
  function render() {
    const det = tab === 'today' && openKey ? PL.byKey[openKey] : null;
    $('hd').hidden = $('rope').hidden = !!det;
    if (!det) $('hd').innerHTML = viewHeader();
    $('view').innerHTML = det ? viewDetail(det) : VIEWS[tab]();
    document.querySelectorAll('.tabs button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  }
  const top = () => { try { window.scrollTo(0, 0); } catch (e) { /* not scrollable here */ } };
  const newDraft = () => Object.assign({}, state.cfg, { days: state.cfg.days.slice(), ttDist: 100, ttTime: '' });
  function go(t) { tab = t; openKey = null; finishing = false; editing = false; if (t === 'setup') draft = newDraft(); render(); top(); }

  /* ---------- saving results ---------- */
  function commit(s, r) {
    const d = iso(today());
    state.done[s.key] = d; delete state.skip[s.key];
    state.res[s.key] = { feel: r.feel || 0, t: Math.round(r.t || 0), g: r.g ? 1 : 0, reps: r.reps || [] };
    if (r.tt && s.tt) { state.tt.push({ id: uid(), date: d, dist: s.tt, secs: r.tt }); state.tt.sort(byDate); }
    if (r.non && s.cont && !state.log.some(e => e.date === d && e.m === s.cont)) { state.log.push({ id: uid(), date: d, m: s.cont, ow: !!r.ow }); state.log.sort(byDate); }
    save();
  }
  function readFin(s, g) {
    const err = $('finErr'), r = { feel: 0, g: g ? 1 : 0 };
    const f = document.querySelector('#finForm input[name="feel"]:checked');
    if (f) r.feel = +f.value;
    const ttEl = $('finTT'), tEl = $('finTime');
    if (ttEl && ttEl.value.trim()) {
      const v = parseT(ttEl.value), p = v / s.tt * 100;
      if (!(p >= 40 && p <= 600)) { err.textContent = 'Enter your trial time as minutes and seconds, like 4:30.'; return null; }
      r.tt = v;
    }
    if (tEl && tEl.value.trim()) {
      const v = parseT(tEl.value);
      if (!(v > 0)) { err.textContent = 'Enter the time as minutes and seconds, like 38:00.'; return null; }
      r.t = v;
    }
    r.non = !!($('finNon') && $('finNon').checked);
    r.ow = !!($('finOW') && $('finOW').checked);
    return r;
  }

  /* ---------- guided workout ---------- */
  let AC = null, wl = null, tickId = 0;
  function beep(freq, dur) {
    if (!snd || !AC) return;
    try {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = freq; g.gain.value = 0.2; o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur);
    } catch (e) { /* no audio here */ }
  }
  const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* no vibration */ } };
  function awake() { try { if (navigator.wakeLock && !wl) navigator.wakeLock.request('screen').then(l => { wl = l; l.addEventListener('release', () => { wl = null; }); }).catch(() => { }); } catch (e) { /* no wake lock */ } }
  function expand(s) {
    const items = [];
    s.steps.forEach((st, si) => {
      const nx = s.steps[si + 1];
      for (let r = 0; r < st.reps; r++) {
        const last = r === st.reps - 1;
        items.push({ kind: st.kind, r: r + 1, n: st.reps, dist: st.dist, zone: st.zone, label: st.label, rest: !last ? st.rest : (nx && nx.kind === st.kind ? st.rest : 0) });
      }
    });
    return items;
  }
  function startPlayer(key) {
    const s = PL.byKey[key];
    if (!s) return;
    editing = false;
    P = { key, items: expand(s), i: 0, phase: 'ready', t0: 0, restEnd: 0, started: 0, end: 0, splits: [], confirm: false, lastB: 0 };
    finishing = false;
    clearInterval(tickId); tickId = setInterval(tick, 200);
    renderPlayer();
  }
  function closePlayer() {
    clearInterval(tickId); P = null;
    try { if (wl) wl.release(); } catch (e) { /* already released */ }
    wl = null;
    renderPlayer(); render();
  }
  const itemTarget = it => { const p = it.zone !== 'max' && pace(it.zone); return p ? p * it.dist / 100 : 0; };
  function itemHead(it) { return `<b>${esc(it.kind === 'drill' && it.label ? it.label : KIND[it.kind])}</b>${it.n > 1 ? ' · rep ' + it.r + ' of ' + it.n : ''}`; }
  function itemZone(it) { const z = ZONES[it.zone], tg = itemTarget(it); return `${pips(z.lvl)}${z.name}${tg ? ' · aim for ' + fmtT(tg) : ''}`; }
  function renderPlayer() {
    const el = $('player');
    if (!P) { el.hidden = true; el.innerHTML = ''; document.body.classList.remove('lock'); return; }
    const s = PL.byKey[P.key];
    el.hidden = false; el.className = 'player onpool ' + tyc(s); document.body.classList.add('lock');
    if (P.phase === 'finish') {
      const reps = P.items.map((it, i) => P.splits[i] ? [it.dist, Math.round(P.splits[i]), it.kind === 'main' && it.zone !== 'easy' ? 1 : 0] : null).filter(Boolean);
      const rs = repStats(reps), tti = P.items.findIndex(it => it.zone === 'max'), tgt = pace(mainStep(s).zone);
      P.result = { t: (P.end - P.started) / 1000, reps, tt: tti >= 0 && P.splits[tti] ? Math.round(P.splits[tti]) : 0 };
      el.innerHTML = `<div class="in"><div class="plsum"><p class="plk">Workout complete</p><p class="plclock">${fmtT(P.result.t)}</p><p class="plz">${esc(s.title)} · ${num(s.metres)} m</p>
        ${rs ? `<p class="plcue">Main set average ${fmtT(rs.avg)} per 100 m${tgt && mainStep(s).zone !== 'max' ? ', target ' + fmtT(tgt) : ''}</p><div class="reps">${rs.chips}</div>` : ''}</div>
        <div class="plsheet">${finForm(s, P.result)}</div></div>`;
      return;
    }
    const it = P.items[P.i], nx = P.items[P.i + 1], z = ZONES[it.zone];
    let body, btn;
    if (P.phase === 'ready') {
      body = `<p class="plk">${P.i === 0 ? 'First up' : 'Up next'} · ${itemHead(it)}</p><p class="pldist">${num(it.dist)} m</p><p class="plz">${itemZone(it)}</p><p class="plcue">${z.cue}${it.kind !== 'drill' && it.label ? ' ' + esc(it.label.charAt(0).toUpperCase() + it.label.slice(1)) + '.' : ''}</p>`;
      btn = `<button class="plmain" data-act="plmain">${P.i === 0 ? 'Start workout' : 'Start'}</button>`;
    } else if (P.phase === 'swim') {
      body = `<p class="plk">${itemHead(it)}</p><p class="plclock" id="plClock" aria-live="off">${fmtT((Date.now() - P.t0) / 1000)}</p><p class="plset">${num(it.dist)} m${it.dist > PL.pool ? ' · ' + (it.dist / PL.pool) + ' lengths' : ''}</p><p class="plz">${itemZone(it)}</p>`;
      btn = `<button class="plmain" data-act="plmain">Done</button>`;
    } else {
      const last = P.splits[P.i], tg = itemTarget(it), df = tg ? Math.round(last - tg) : 0;
      body = `<p class="plk">Rest</p><p class="plclock rest" id="plClock">${Math.max(0, Math.ceil((P.restEnd - Date.now()) / 1000))}</p>
        <p class="plset">Last rep ${fmtT(last)}${tg ? (Math.abs(df) < 2 ? ', on target' : ', ' + Math.abs(df) + ' s ' + (df < 0 ? 'faster' : 'slower') + ' than target') : ''}</p>
        <p class="plcue">Next: ${num(nx.dist)} m ${ZONES[nx.zone].name.toLowerCase()}${nx.n > 1 ? ', rep ' + nx.r + ' of ' + nx.n : ''}. The clock starts when the rest ends.</p>`;
      btn = `<button class="plmain alt" data-act="plmain">Go now</button>`;
    }
    el.innerHTML = `<div class="in"><div class="plbar"><button class="plbtn" data-act="plclose" aria-label="End workout">${ICON_X}</button>
      <p class="plprog">Step ${P.i + 1} of ${P.items.length}</p><button class="plbtn" data-act="plsound" aria-pressed="${snd}">Sound ${snd ? 'on' : 'off'}</button></div>
      <div class="pltrack"><i style="width:${Math.round(100 * P.i / P.items.length)}%"></i></div>
      ${P.confirm ? `<div class="plconfirm"><p>End this workout? The times from this session will not be saved.</p><div class="btnrow"><button class="btn ghost" data-act="plkeep">Keep going</button><button class="btn" data-act="plend">End workout</button></div></div>` : ''}
      <div class="plbody">${body}</div>${btn}
      <div class="plfoot"><button class="plmini" data-act="plback"${P.i === 0 && P.phase === 'ready' ? ' disabled' : ''}>Back a step</button><button class="plmini" data-act="plskip">Skip this step</button></div></div>`;
  }
  function tick() {
    if (!P) return;
    const now = Date.now(), c = $('plClock');
    if (P.phase === 'swim') { if (c) c.textContent = fmtT((now - P.t0) / 1000); }
    else if (P.phase === 'rest') {
      const left = Math.ceil((P.restEnd - now) / 1000);
      if (left <= 0) { P.i++; P.phase = 'swim'; P.t0 = P.restEnd; beep(880, 0.5); buzz(300); renderPlayer(); return; }
      if (left <= 3 && left !== P.lastB) { P.lastB = left; beep(440, 0.12); }
      if (c) c.textContent = String(left);
    }
  }
  function plMain() {
    const now = Date.now(), it = P.items[P.i];
    if (P.phase === 'ready') {
      try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; }
      awake();
      if (!P.started) P.started = now;
      P.phase = 'swim'; P.t0 = now;
    } else if (P.phase === 'swim') {
      if (now - P.t0 < 2000) return;   /* ignore a double tap on Start */
      P.splits[P.i] = (now - P.t0) / 1000;
      if (P.i === P.items.length - 1) { P.phase = 'finish'; P.end = now; }
      else if (it.rest > 0) { P.phase = 'rest'; P.restEnd = now + it.rest * 1000; P.lastB = 0; }
      else { P.i++; P.phase = 'ready'; }
    } else if (P.phase === 'rest') { P.i++; P.phase = 'swim'; P.t0 = now; }
    renderPlayer();
  }

  /* ---------- events ---------- */
  function applyDraft() {
    const d = draft, err = $('cfgErr'), fail = m => { err.textContent = m; };
    if (!ISO_RE.test(d.start) || !ISO_RE.test(d.race)) return fail('Pick a start date and a race date.');
    if (!(d.level >= 0 && d.level <= 2400)) return fail('Enter your longest non-stop swim in metres, from 0 to 2 400.');
    if (!validRace(d)) return fail('Pick a race date between 6 and 40 weeks after the plan start.');
    if (d.days.length !== d.perWeek) return fail('Pick ' + d.perWeek + ' swim days.');
    let tt = 0;
    if (d.ttTime.trim()) {
      tt = parseT(d.ttTime);
      const p = tt / d.ttDist * 100;
      if (!(p >= 40 && p <= 600)) return fail('Enter the timed swim as minutes and seconds, like 2:10.');
    }
    state.cfg = normCfg(Object.assign({}, d, { setup: true }));
    if (tt) { state.tt.push({ id: uid(), date: iso(today()), dist: d.ttDist, secs: tt }); state.tt.sort(byDate); }
    rebuild(); wk = curWeek(); nudgeOff = true;
    save(); go('today');
  }
  const ACTS = {
    tab: b => go(b.dataset.tab),
    prev: () => { if (wk > 0) { wk--; render(); } },
    next: () => { if (wk < PL.N - 1) { wk++; render(); } },
    goto: b => { wk = +b.dataset.w; go('today'); },
    open: b => { const s = PL.byKey[b.dataset.key]; if (!s) return; tab = 'today'; wk = s.w; openKey = s.key; finishing = false; editing = false; render(); top(); },
    back: () => { openKey = null; finishing = false; editing = false; render(); top(); },
    skip: b => { state.skip[b.dataset.key] = 1; save(); render(); },
    unskip: b => { delete state.skip[b.dataset.key]; save(); render(); },
    edit: () => { const s = PL.byKey[openKey]; if (!s) return; edDraft = s.steps.map(x => Object.assign({}, x)); editing = true; render(); top(); },
    edadd: () => { syncEd(); const i = edDraft.findIndex(x => x.kind === 'cd'); edDraft.splice(i < 0 ? edDraft.length : i, 0, { kind: 'main', reps: 4, dist: 100, zone: 'steady', rest: 20, label: '' }); render(); },
    edrm: b => { syncEd(); edDraft.splice(+b.dataset.i, 1); render(); },
    edsave: saveEd,
    edcancel: () => { editing = false; render(); top(); },
    edreset: () => { delete state.edits[openKey]; editing = false; applyMoves(); save(); render(); top(); },
    editres: () => { finishing = true; render(); const f = $('finForm'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center' }); },
    finish: () => { finishing = true; render(); const f = $('finForm'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center' }); },
    cancelfin: () => { finishing = false; render(); },
    undo: b => { delete state.done[b.dataset.key]; delete state.res[b.dataset.key]; save(); render(); },
    move: b => { const s = PL.byKey[b.dataset.key]; if (!s) return; if (b.dataset.to === s.key) delete state.moved[s.key]; else state.moved[s.key] = b.dataset.to; applyMoves(); save(); render(); },
    del: b => { state.log = state.log.filter(x => x.id !== b.dataset.id); save(); render(); },
    deltt: b => { state.tt = state.tt.filter(x => x.id !== b.dataset.id); save(); render(); },
    replan: () => { go('setup'); draft.start = iso(today()); const best = state.log.reduce((x, e) => Math.max(x, e.m), 0); if (best > draft.level) draft.level = Math.min(2400, best); render(); },
    nudgeoff: () => { nudgeOff = true; render(); },
    startnow: () => { draft.start = iso(today()); $('cfgStart').value = draft.start; $('cfgPrev').textContent = draftPreview(draft); },
    apply: applyDraft,
    play: b => startPlayer(b.dataset.key),
    plmain: plMain,
    plclose: () => { if (!P.started) closePlayer(); else { P.confirm = true; renderPlayer(); } },
    plkeep: () => { P.confirm = false; renderPlayer(); },
    plend: closePlayer,
    plsound: () => { snd = !snd; ls.set(SND_KEY, snd ? 'on' : 'off'); renderPlayer(); },
    plback: () => { if (P.phase === 'ready' && P.i > 0) P.i--; P.phase = 'ready'; delete P.splits[P.i]; renderPlayer(); },
    plskip: () => { if (P.i === P.items.length - 1) { P.phase = 'finish'; P.end = Date.now(); if (!P.started) P.started = P.end; } else { P.i++; P.phase = 'ready'; } renderPlayer(); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-act]');
    if (b && !b.disabled && ACTS[b.dataset.act]) ACTS[b.dataset.act](b);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (!t || tab !== 'setup' || !draft) return;
    if (t.id === 'cfgLevel') draft.level = t.value === '' ? NaN : parseInt(t.value, 10);
    else if (t.id === 'cfgStart') draft.start = t.value;
    else if (t.id === 'cfgRace') draft.race = t.value;
    else if (t.id === 'cfgTTDist') draft.ttDist = +t.value;
    else if (t.id === 'cfgTTTime') draft.ttTime = t.value;
    else if (t.name === 'perWeek') { draft.perWeek = +t.value; draft.days = PRESETS[draft.perWeek].slice(); render(); return; }
    else if (t.name === 'pool') draft.pool = +t.value === 50 ? 50 : 25;
    else if (t.name === 'peak') draft.peak = +t.value;
    else if (t.name === 'day') { const n = +t.value, i = draft.days.indexOf(n); if (t.checked && i < 0) draft.days.push(n); else if (!t.checked && i >= 0) draft.days.splice(i, 1); }
    const pv = $('cfgPrev'); if (pv) pv.textContent = draftPreview(draft);
  });
  document.addEventListener('submit', e => {
    const id = e.target && e.target.id;
    if (!id) return;
    e.preventDefault();
    if (id === 'finForm') {
      const g = P && P.phase === 'finish', s = PL.byKey[g ? P.key : openKey];
      if (!s) return;
      const r = readFin(s, g);
      if (!r) return;
      if (g) { r.t = P.result.t; r.reps = P.result.reps; openKey = s.key; tab = 'today'; }
      if (!g && state.done[s.key]) { state.res[s.key] = Object.assign({ g: 0, reps: [] }, state.res[s.key], { feel: r.feel, t: Math.round(r.t || 0) }); save(); }
      else commit(s, r);
      finishing = false;
      if (g) closePlayer(); else render();
      top();
    } else if (id === 'logForm') {
      const m = parseInt($('logM').value, 10), d = $('logD').value, err = $('logErr');
      if (!(m >= 25 && m <= 10000)) { err.textContent = 'Enter the distance in metres, from 25 to 10 000.'; return; }
      if (!ISO_RE.test(d) || d > iso(today())) { err.textContent = 'Pick today or an earlier date.'; return; }
      state.log.push({ id: uid(), date: d, m, ow: $('logOW').checked }); state.log.sort(byDate);
      save(); render();
    } else if (id === 'ttForm') {
      const dist = +$('ttDist').value, secs = parseT($('ttTime').value), d = $('ttDate').value, err = $('ttErr'), p = secs / dist * 100;
      if (!(p >= 40 && p <= 600)) { err.textContent = 'Enter the time as minutes and seconds, like 2:10.'; return; }
      if (!ISO_RE.test(d) || d > iso(today())) { err.textContent = 'Pick today or an earlier date.'; return; }
      state.tt.push({ id: uid(), date: d, dist, secs }); state.tt.sort(byDate);
      save(); render();
    }
  });
  document.addEventListener('visibilitychange', () => { if (P && document.visibilityState === 'visible') { awake(); tick(); } });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) go(h); });

  const h0 = location.hash.slice(1);
  if (TABS.includes(h0)) { tab = h0; if (tab === 'setup') draft = newDraft(); }
  render();
  initCloud();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
