<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#17594D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one narrow column, fixed bottom tab bar. Pool-deck whiteboard feel: condensed numerals for sets, a lane-rope divider, buoy orange as the single action colour. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --ink: #0F211C;
  --muted: #566A63;
  --line: #D3DCD7;
  --water: #17594D;
  --water-soft: #DCEBE6;
  --buoy: #C2410C;
  --on-buoy: #FFFFFF;
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1512;
    --surface: #11221D;
    --ink: #E5EFEA;
    --muted: #8DA39A;
    --line: #223630;
    --water: #66C7AD;
    --water-soft: #17332C;
    --buoy: #FF8A55;
    --on-buoy: #1B0B03;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1512;
  --surface: #11221D;
  --ink: #E5EFEA;
  --muted: #8DA39A;
  --line: #223630;
  --water: #66C7AD;
  --water-soft: #17332C;
  --buoy: #FF8A55;
  --on-buoy: #1B0B03;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--f-body);
  padding-inline: 16px;
  padding-block: 12px 104px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--buoy); outline-offset: 2px; }
b { font-weight: 600; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 8px 14px; }
.eyebrow { font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.count { font: 700 60px/.9 var(--f-display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.count small { font: 600 22px var(--f-display); color: var(--muted); letter-spacing: .02em; margin-left: 8px; }
.topr { text-align: right; font: 600 14px var(--f-body); color: var(--muted); min-width: 0; }
.rope {
  height: 10px; margin-bottom: 18px;
  background:
    radial-gradient(circle at 5px 5px, var(--buoy) 3.5px, transparent 4px) 0 0 / 20px 10px repeat-x,
    radial-gradient(circle at 15px 5px, var(--water) 3.5px, transparent 4px) 0 0 / 20px 10px repeat-x,
    linear-gradient(var(--line), var(--line)) 0 50% / 100% 1px no-repeat;
}

/* week header */
.wknav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.wkt { text-align: center; min-width: 0; }
.phase { font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--water); }
.wkt h1 { font: 700 40px/1 var(--f-display); margin-top: 2px; }
.wkt h1 span { font: 600 20px var(--f-display); color: var(--muted); }
.step { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.step:disabled { opacity: .35; cursor: default; }
.dates { margin-top: 12px; text-align: center; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; align-items: center; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--water-soft); color: var(--water); font: 600 12px var(--f-body); letter-spacing: .04em; }
.focus { margin: 12px auto 0; text-align: center; max-width: 34ch; text-wrap: balance; font-size: 17px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 16px 0 18px; }
.seg i { height: 6px; border-radius: 3px; background: var(--line); }
.seg i.on { background: var(--water); }

/* session card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card.is-done { border-color: var(--water); }
.sh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sh > div { min-width: 0; }
.day { font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sh h2 { font: 700 26px/1.05 var(--f-display); margin-top: 4px; text-wrap: balance; }
.m { text-align: right; font: 700 32px/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.m small { display: block; font: 500 13px var(--f-body); color: var(--muted); margin-top: 3px; }
.sets { list-style: none; margin: 14px 0 12px; padding: 0; border-top: 1px solid var(--line); }
.sets li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.tag { font: 600 11px var(--f-body); letter-spacing: .14em; color: var(--muted); }
.sets .main .tag { color: var(--buoy); }
.what { min-width: 0; overflow-wrap: anywhere; }
.what i { font-style: normal; color: var(--muted); margin-left: 8px; font-size: 14px; }
.sets .main .what b { font: 700 28px/1 var(--f-display); letter-spacing: .01em; }
.note { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.tick { width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--buoy); background: var(--buoy); color: var(--on-buoy); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tick[aria-pressed="true"] { background: transparent; color: var(--water); border-color: var(--water); }
.legend { font-size: 13px; color: var(--muted); padding-inline: 4px; }

/* plan */
.phasehead { margin: 8px 0 4px; }
.phasehead h2 { font: 700 26px/1.1 var(--f-display); }
.phasehead p { font-size: 14px; color: var(--muted); }
.list { margin-bottom: 22px; border-top: 1px solid var(--line); }
.weekrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; min-height: 60px; }
.weekrow .n { font: 700 32px/1 var(--f-display); color: var(--water); text-align: center; }
.weekrow .t { min-width: 0; }
.weekrow .t b { display: block; font-size: 15px; }
.weekrow .t span { display: block; font-size: 13px; color: var(--muted); }
.weekrow .r { text-align: right; font: 600 13px var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.weekrow .r em { font-style: normal; display: block; color: var(--ink); font-size: 15px; }
.weekrow.now .n::after { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--buoy); margin: 4px auto 0; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0; overflow: hidden; }
.stats > div { padding: 14px 12px; border-right: 1px solid var(--line); min-width: 0; }
.stats > div:last-child { border-right: 0; }
.stats .v { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats .v small { font: 600 16px var(--f-display); color: var(--muted); }
.stats .l { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
.card h3 { font: 700 22px/1.1 var(--f-display); margin-bottom: 10px; }
svg.chart { width: 100%; height: auto; display: block; }
.grid { stroke: var(--line); stroke-width: 1; fill: none; }
.ax { fill: var(--muted); font: 500 10.5px var(--f-body); }
.goal { stroke: var(--buoy); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.goalt { fill: var(--buoy); font: 600 10.5px var(--f-body); }
.ln { fill: none; stroke: var(--water); stroke-width: 2; }
.pt { fill: var(--water); stroke: var(--surface); stroke-width: 2; }
.pt.ow { fill: var(--buoy); }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--water); margin-right: 6px; }
.key span.o::before { background: var(--buoy); }
.empty { font-size: 14px; color: var(--muted); margin-top: 8px; }
.miles { list-style: none; margin: 0; padding: 0; }
.miles li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.miles li:first-child { border-top: 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.miles li.ok .dot { background: var(--water); border-color: var(--water); color: var(--surface); }
.miles .w { font: 500 13px var(--f-body); color: var(--muted); text-align: right; }
form.log { display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; }
.fld > label, .fld > .lab, .chk label { font: 600 13px var(--f-body); color: var(--muted); }
.fld input[type=number], .fld input[type=date] { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px; font: 500 18px var(--f-body); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.chk input { width: 22px; height: 22px; accent-color: var(--buoy); }
.chk label { font-size: 15px; color: var(--ink); font-weight: 500; }
.err { color: var(--buoy); font-size: 14px; }
.entries { list-style: none; margin: 0; padding: 0; }
.entries li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.entries .md { font: 700 22px var(--f-display); font-variant-numeric: tabular-nums; }
.entries .dd { font-size: 13px; color: var(--muted); }
.entries .tg { font: 600 11px var(--f-body); letter-spacing: .08em; color: var(--buoy); text-transform: uppercase; }
.rm { min-height: 40px; min-width: 40px; border: 0; background: none; color: var(--muted); border-radius: 8px; font-size: 13px; text-decoration: underline; }

/* setup */
.setup { display: grid; gap: 18px; }
.opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.opt { position: relative; display: block; min-width: 0; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt span { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 600; font-size: 15px; }
.days .opt span { min-height: 44px; font-size: 13px; }
.opt input:checked + span { background: var(--water-soft); border-color: var(--water); color: var(--water); }
.opt input:focus-visible + span { outline: 3px solid var(--buoy); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); }
.sum { font-size: 15px; color: var(--muted); }
.sum b { color: var(--ink); }
.lnk { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 44px; width: 100%; }

/* race */
.tips { list-style: none; margin: 0; padding: 0; }
.tips li { padding: 12px 0; border-top: 1px solid var(--line); }
.tips li:first-child { border-top: 0; }
.tips b { display: block; font: 700 20px/1.1 var(--f-display); margin-bottom: 2px; }
.tips span { color: var(--muted); font-size: 15px; }
.big { font: 700 44px/1 var(--f-display); }
.cardp { color: var(--muted); margin-top: 6px; font-size: 15px; }
.cardp a { color: var(--water); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; max-width: 560px; margin-inline: auto; }
.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; color: var(--muted); font: 600 11.5px var(--f-body); min-height: 52px; border-radius: 10px; padding-inline: 2px; }
.tabs button[aria-current="page"] { color: var(--water); background: var(--water-soft); }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 360px) { .count { font-size: 52px; } .stats .v { font-size: 28px; } }
</style>

<div class="wrap">
  <header class="top" id="hd"></header>
  <div class="rope" aria-hidden="true"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-act="tab" data-tab="week"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-act="tab" data-tab="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Plan</button>
  <button data-act="tab" data-tab="progress"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16l4-5 4 3 5-8"/></svg>Progress</button>
  <button data-act="tab" data-tab="race"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Race</button>
  <button data-act="tab" data-tab="setup"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h9M18 6h3M3 12h3M12 12h9M3 18h11M20 18h1"/><circle cx="15" cy="6" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/></svg>Setup</button>
</div></nav>

<script>
(function () {
  'use strict';
  var DAY = 864e5, PEAK = 2000, OW_GOAL = 4;
  var KEY = 'midmar-trainer-v2';
  var OLD_KEY = 'midmar-trainer-v1';
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var DEF = { start: '2026-10-05', race: '2027-02-13', level: 200, perWeek: 3, days: [1, 3, 6], pool: 25 };
  var PRESETS = { 2: [3, 6], 3: [1, 3, 6], 4: [1, 2, 4, 6] };
  var ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

  function num(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseISO(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function fmtS(d) { return d.getDate() + ' ' + MON[d.getMonth()]; }
  function fmtD(d) { return DOW[d.getDay()] + ' ' + fmtS(d); }
  function fmtY(d) { return fmtS(d) + ' ' + d.getFullYear(); }
  function fmtDist(a) { return a >= 1000 ? (Math.round(a / 10) / 100) + ' km' : num(a) + ' m'; }
  function weeksBetween(start, race) { return Math.floor(Math.round((race - start) / DAY) / 7); }

  /* ---------- config ---------- */
  function validRace(cfg) {
    var rw = weeksBetween(mondayOf(parseISO(cfg.start)), parseISO(cfg.race));
    return rw >= 5 && rw <= 39;
  }
  function normCfg(c) {
    c = c && typeof c === 'object' ? c : {};
    var o = {};
    o.start = ISO_RE.test(c.start) ? c.start : DEF.start;
    o.race = ISO_RE.test(c.race) ? c.race : DEF.race;
    o.level = isFinite(c.level) ? Math.min(2000, Math.max(0, Math.round(c.level))) : DEF.level;
    o.perWeek = [2, 3, 4].indexOf(c.perWeek) >= 0 ? c.perWeek : DEF.perWeek;
    var dd = Array.isArray(c.days) ? c.days.filter(function (x, i, a) { return x >= 0 && x <= 6 && x % 1 === 0 && a.indexOf(x) === i; }) : [];
    o.days = dd.length === o.perWeek ? dd.slice().sort(function (a, b) { return a - b; }) : PRESETS[o.perWeek].slice();
    o.pool = c.pool === 50 ? 50 : 25;
    if (!validRace(o)) { o.start = DEF.start; o.race = DEF.race; }
    return o;
  }

  /* ---------- plan generator ---------- */
  function buildPlan(cfg) {
    var pool = cfg.pool;
    var start = mondayOf(parseISO(cfg.start)), race = parseISO(cfg.race);
    var raceWeek = weeksBetween(start, race), W = raceWeek + 1, Tn = W - 2;
    var raceOff = Math.round((race - addDays(start, raceWeek * 7)) / DAY);
    var offs = cfg.days.map(function (d) { return (d + 6) % 7; }).sort(function (a, b) { return a - b; });

    function stp(v) { return pool === 50 ? 50 : (v < 500 ? 25 : 50); }
    function rnd(x, s) { return Math.max(s, Math.round(x / s) * s); }
    function restFor(p) { return Math.max(15, Math.round((40 - 20 * p) / 5) * 5); }
    function dist(x) {
      var d = x < 150 ? 50 : x < 300 ? 75 : x < 500 ? 100 : x < 1400 ? 200 : x < 1800 ? 300 : 400;
      return Math.max(pool, Math.ceil(d / pool) * pool);
    }
    function wc(a) { return a < 1000 ? { wu: 100, cd: 50 } : { wu: 200, cd: 100 }; }
    function sess(title, o) {
      o = Object.assign({ wu: 100, cd: 50, drill: false, main: [], cont: 0, note: '' }, o);
      var lines = [{ tag: 'WU', txt: num(o.wu) + ' m easy' }], m = o.wu + o.cd;
      if (o.drill) { lines.push({ tag: 'DRILL', txt: '4 × ' + pool + ' m side-kick drill', sub: 'rest 15 s' }); m += 4 * pool; }
      o.main.forEach(function (a) { lines.push({ tag: 'MAIN', n: a[0], d: a[1], rest: a[2], x: a[3] || '' }); m += a[0] * a[1]; });
      if (o.cont) { lines.push({ tag: 'MAIN', cont: o.cont }); m += o.cont; }
      lines.push({ tag: 'CD', txt: num(o.cd) + ' m easy' });
      return { title: title, lines: lines, metres: m, note: o.note };
    }
    function longSess(a, p, title, note) {
      var w = wc(a);
      if (a >= 400) return sess(title || 'Long swim', { wu: w.wu, cd: w.cd, cont: a, note: note });
      var d = Math.max(pool, rnd(a * 0.5, pool)), n = Math.max(3, Math.ceil(a * 2.5 / d));
      return sess('Easy volume', { wu: w.wu, cd: w.cd, main: [[n, d, restFor(p)]], note: note });
    }
    function intSess(a, p, drill) {
      var w = wc(a), total = Math.min(1600, 1.2 * a + 300), d = dist(a);
      return sess(drill ? 'Intervals and technique' : 'Intervals', { wu: w.wu, cd: w.cd, drill: drill, main: [[Math.max(2, Math.round(total / d)), d, restFor(p)]] });
    }
    function techSess(a, p) {
      var w = wc(a), total = Math.min(800, 0.5 * a + 250), d = dist(a * 0.5);
      return sess('Breathing and technique', { wu: w.wu, cd: w.cd, drill: true, main: [[Math.max(2, Math.round(total / d)), d, Math.max(15, restFor(p) - 5)]] });
    }

    /* long-swim ladder: geometric growth, a lighter week every 4th week */
    var a0 = Math.max(100, cfg.level >= 400 ? cfg.level * 0.8 : cfg.level);
    var a = [], rec = [], bv = [], t, prog;
    for (t = 0; t < Tn; t++) {
      prog = Tn > 1 ? t / (Tn - 1) : 1;
      bv[t] = a0 * Math.pow(PEAK / a0, prog);
      rec[t] = (t % 4 === 3 && t < Tn - 1);
      var v = rec[t] ? bv[t] * 0.75 : bv[t];
      a[t] = rnd(v, stp(v));
    }
    var m4 = -1;
    if (cfg.level < 400) for (t = 0; t < Tn; t++) { if (!rec[t] && a[t] >= 400) { m4 = t; break; } }

    /* open-water weeks, spread over the weeks where the long swim is 800 m or more */
    var cand = [], owAt = {};

      '<button class="tick" data-act="apply">Update plan</button>' +
      '<button class="lnk" data-act="reset">Reset to the original plan</button></section>';
    h += '<p class="legend">Swims you have ticked stay ticked by date when the plan changes. Your logged swims are not affected.</p>';
    return h;
  }

  var VIEWS = { week: viewWeek, plan: viewPlan, progress: viewProgress, race: viewRace, setup: viewSetup };
  function render() {
    document.getElementById('hd').innerHTML = viewHeader();
    document.getElementById('view').innerHTML = VIEWS[tab]();
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function top() { try { window.scrollTo(0, 0); } catch (e) { } }
  function cloneCfg(c) { return { start: c.start, race: c.race, level: c.level, perWeek: c.perWeek, days: c.days.slice(), pool: c.pool }; }

  function applyDraft() {
    var d = draft, err = document.getElementById('cfgErr');
    function fail(m) { err.textContent = m; }
    if (!ISO_RE.test(d.start) || !ISO_RE.test(d.race)) return fail('Pick a start date and a race date.');
    if (!(d.level >= 0 && d.level <= 2000)) return fail('Enter your longest non-stop swim in metres, from 0 to 2 000.');
    if (!validRace(d)) return fail('Pick a race date between 6 and 40 weeks after the plan start.');
    if (d.days.length !== d.perWeek) return fail('Pick ' + d.perWeek + ' swim days.');
    state.cfg = normCfg(d);
    PL = buildPlan(state.cfg);
    wk = curWeek();
    save();
    tab = 'week'; render(); top();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (!b) return;
    var a = b.dataset.act;
    if (a === 'tab') { tab = b.dataset.tab; if (tab === 'setup') draft = cloneCfg(state.cfg); render(); top(); }
    else if (a === 'prev') { if (wk > 0) { wk--; render(); top(); } }
    else if (a === 'next') { if (wk < PL.N - 1) { wk++; render(); top(); } }
    else if (a === 'goto') { wk = +b.dataset.w; tab = 'week'; render(); top(); }
    else if (a === 'toggle') {
      var k = b.dataset.key;
      if (state.done[k]) delete state.done[k]; else state.done[k] = iso(today());
      save(); render();
    }
    else if (a === 'del') {
      state.log = state.log.filter(function (x) { return x.id !== b.dataset.id; });
      save(); render();
    }
    else if (a === 'apply') { applyDraft(); }
    else if (a === 'reset') { draft = cloneCfg(DEF); render(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || tab !== 'setup' || !draft) return;
    if (t.id === 'cfgLevel') draft.level = t.value === '' ? NaN : parseInt(t.value, 10);
    else if (t.id === 'cfgStart') draft.start = t.value;
    else if (t.id === 'cfgRace') draft.race = t.value;
    else if (t.name === 'perWeek') { draft.perWeek = +t.value; draft.days = PRESETS[draft.perWeek].slice(); render(); }
    else if (t.name === 'pool') draft.pool = +t.value === 50 ? 50 : 25;
    else if (t.dataset && t.dataset.day !== undefined) {
      var n = +t.dataset.day, i = draft.days.indexOf(n);
      if (t.checked && i < 0) draft.days.push(n); else if (!t.checked && i >= 0) draft.days.splice(i, 1);
    }
  });
  document.addEventListener('submit', function (e) {
    if (!e.target || e.target.id !== 'logForm') return;
    e.preventDefault();
    var m = parseInt(document.getElementById('logM').value, 10);
    var d = document.getElementById('logD').value;
    var err = document.getElementById('logErr');
    if (!(m >= 25 && m <= 10000)) { err.textContent = 'Enter the distance in metres, from 25 to 10 000.'; return; }
    if (!ISO_RE.test(d) || d > iso(today())) { err.textContent = 'Pick today or an earlier date.'; return; }
    state.log.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: d, m: m, ow: document.getElementById('logOW').checked });
    state.log.sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : 0; });
    save(); render();
  });

  render();
  initCloud();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
